name: Change proposal
description: Propose a change to the method, a role or a skill
labels: [proposal]
body:
  - type: textarea
    attributes:
      label: Problem
      description: One paragraph.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Change
    validations:
      required: true
  - type: textarea
    attributes:
      label: Cost and what it removes
      description: A new file, more tokens, one more question to the human; and the work it saves. See docs/contributing.md.
    validations:
      required: true
