# Builds the documentation site on every pull request and push, and deploys it to GitHub Pages
# from main only. The build job runs docmd with read-only contents and no token; the deploy job
# alone holds the Pages token and runs no checkout and no package code.
name: pages

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      npm_config_ignore_scripts: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the site
        run: npx -y @docmd/core@0.9.7 build
      - name: Install the site test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-tools" --no-save --no-package-lock playwright@1.64.0 axe-core@4.10.3
          "$RUNNER_TEMP/site-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the built site
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/site-tools
        run: |
          node scripts/site-checks.test.mjs . --lasting
          node scripts/site-measure.test.mjs .
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
